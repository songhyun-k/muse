name: Release
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup override set stable
      - name: Verify source and behavior
        run: cargo xtask check
      - name: Build and inspect release
        run: cargo xtask release
      - name: Export public source
        run: cargo xtask audit --export
      - name: Publish exact verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask publish --publish
