[package]
name = "music-frontend"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
signal-hook = "0.3"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
